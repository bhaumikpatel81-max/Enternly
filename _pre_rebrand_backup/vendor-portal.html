<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a1628">
<title>Enternly — Vendor Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1a1d24; --paper: #f5f7fc; --card: #ffffff;
    --line: #e2e8f0; --accent: #1e63f2; --muted: #64748b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Space Grotesk', system-ui, sans-serif;
    background: var(--paper); color: var(--ink);
    min-height: 100vh;
  }
  /* ---- login screen ---- */
  #login-screen {
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 16px;
  }
  .box {
    background: var(--card); width: 100%; max-width: 480px;
    border: 1px solid var(--line); border-radius: 8px; overflow: hidden;
    box-shadow: 0 4px 24px rgba(30,99,242,0.10);
  }
  .box-top { padding: 28px 44px 22px; text-align: center; border-bottom: 4px solid var(--accent); }
  .logo { height: 120px; width: auto; margin-bottom: 10px; }
  .tagline { font-size: 11px; color: var(--accent); letter-spacing: 2px; text-transform: uppercase; font-weight: 600; }
  .box-body { padding: 28px 44px 24px; }
  h1 { font-size: 24px; font-weight: 700; margin-bottom: 16px; }
  .error-box {
    background: #fde8e4; border: 1px solid #f5b8ae; color: #8b2a1a;
    font-size: 14px; padding: 10px 14px; border-radius: 4px; margin-bottom: 14px;
  }
  .success-box {
    background: #e4f7ea; border: 1px solid #a8dbb5; color: #1a5c2a;
    font-size: 14px; padding: 10px 14px; border-radius: 4px; margin-bottom: 14px;
  }
  label {
    display: block; font-size: 12px; text-transform: uppercase;
    letter-spacing: 1px; color: var(--muted); margin: 14px 0 5px; font-weight: 600;
  }
  input, select {
    width: 100%; padding: 11px 14px; border: 1px solid var(--line);
    border-radius: 6px; font-family: inherit; font-size: 16px;
    background: #f8faff; outline: none; transition: border-color 0.15s;
  }
  input:focus, select:focus { border-color: var(--accent); background: #fff; }
  .pw-wrap { position: relative; }
  .pw-wrap input { padding-right: 42px; }
  .pw-toggle {
    position: absolute; top: 50%; right: 6px; transform: translateY(-50%);
    background: none; border: none; cursor: pointer; padding: 6px;
    line-height: 0; font-size: 18px; color: var(--muted);
  }
  .btn {
    width: 100%; margin-top: 22px; padding: 14px; background: var(--accent);
    color: #fff; border: none; border-radius: 6px; font-family: inherit;
    font-size: 17px; cursor: pointer; font-weight: 600; letter-spacing: 0.3px; transition: background 0.15s;
  }
  .btn:hover { background: #1750c9; }
  .btn:disabled { opacity: 0.6; cursor: not-allowed; }
  .btn-sm { width: auto; margin-top: 0; padding: 8px 16px; font-size: 13px; }
  .btn-ghost { background: #fff; color: var(--accent); border: 1px solid var(--accent); }
  .btn-ghost:hover { background: #f0f5ff; }
  .powered-footer {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding: 16px; border-top: 1px solid var(--line); background: #f8faff;
  }
  .powered-footer span { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 1.2px; font-weight: 600; }
  .powered-footer img { height: 30px; width: auto; }

  /* ---- dashboard screen ---- */
  #dash-screen { display: none; max-width: 900px; margin: 0 auto; padding: 24px 16px 48px; }
  .dash-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid var(--line);
  }
  .dash-header .brand { display: flex; align-items: center; gap: 10px; }
  .dash-header img { height: 32px; }
  .dash-header h2 { font-size: 15px; font-weight: 700; }
  .dash-header .who { font-size: 13px; color: var(--muted); }
  .logout-link { font-size: 13px; color: var(--accent); text-decoration: none; font-weight: 600; cursor: pointer; }
  .logout-link:hover { text-decoration: underline; }

  .tabs { display: flex; gap: 4px; margin-bottom: 18px; border-bottom: 1px solid var(--line); }
  .tab {
    padding: 10px 16px; font-size: 13px; font-weight: 600; color: var(--muted);
    cursor: pointer; border-bottom: 2px solid transparent; user-select: none;
  }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  .req-card, .sub-card {
    background: var(--card); border: 1px solid var(--line); border-radius: 8px;
    padding: 16px 20px; margin-bottom: 12px;
  }
  .req-card { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .req-title { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
  .req-meta { font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  .req-skills { font-size: 12px; color: var(--muted); }
  .req-actions { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .badge { font-size: 12px; color: var(--muted); background: #f0f4fa; padding: 4px 10px; border-radius: 999px; }

  .sub-card { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .sub-name { font-size: 15px; font-weight: 700; }
  .sub-meta { font-size: 13px; color: var(--muted); }
  .status-pill {
    display: inline-block; padding: 6px 14px; border-radius: 999px;
    font-size: 12px; font-weight: 600; background: #e8f0fe; color: var(--accent); white-space: nowrap;
  }
  .status-pill.rejected { background: #fde8e4; color: #8b2a1a; }
  .status-pill.hired, .status-pill.offered { background: #e4f7ea; color: #1a5c2a; }

  .empty-state, .loading { text-align: center; color: var(--muted); padding: 48px 16px; font-size: 14px; }

  /* ---- submit modal ---- */
  .modal-bg {
    display: none; position: fixed; inset: 0; background: rgba(10,22,40,0.45);
    align-items: center; justify-content: center; padding: 16px; z-index: 100;
  }
  .modal-bg.open { display: flex; }
  .modal {
    background: #fff; border-radius: 8px; width: 100%; max-width: 480px;
    max-height: 90vh; overflow-y: auto; padding: 24px 28px;
  }
  .modal h3 { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
  .modal .sub { font-size: 13px; color: var(--muted); margin-bottom: 10px; }
  .modal-actions { display: flex; gap: 10px; margin-top: 18px; }
  .modal-actions .btn { margin-top: 0; }

  @media (max-width: 540px) {
    .box { max-width: 100%; border-radius: 0; border-left: none; border-right: none; box-shadow: none; }
    .box-top { padding: 24px 24px 18px; }
    .box-body { padding: 20px 24px 20px; }
    .logo { height: 96px; }
    h1 { font-size: 22px; }
    .req-card, .sub-card { flex-direction: column; align-items: flex-start; }
    .req-actions { width: 100%; }
    .req-actions .btn { width: 100%; }
  }
</style>
</head>
<body>

<div id="login-screen">
  <div class="box">
    <div class="box-top">
      <img src="/assets/Enternly_logo.png" alt="Enternly" class="logo">
      <div class="tagline">Embrace Generations to Next</div>
    </div>
    <div class="box-body">
      <h1>Vendor sign in</h1>
      <div id="err" class="error-box" style="display:none"></div>
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" placeholder="poc@vendor.com">
      <label for="pw">Password</label>
      <div class="pw-wrap">
        <input id="pw" type="password" autocomplete="current-password" placeholder="••••••••">
        <button type="button" class="pw-toggle" tabindex="-1" aria-label="Show password" onclick="togglePw()">👁</button>
      </div>
      <button class="btn" id="btn" onclick="doLogin()">Sign in</button>
    </div>
    <div class="powered-footer">
      <span>Powered by</span>
      <img src="/assets/enternly-logo.png" alt="EnternsTech">
    </div>
  </div>
</div>

<div id="dash-screen">
  <div class="dash-header">
    <div class="brand">
      <img src="/assets/Enternly_logo.png" alt="Enternly">
      <div>
        <h2>Vendor Portal</h2>
        <div class="who" id="who"></div>
      </div>
    </div>
    <a class="logout-link" onclick="logout()">Sign out</a>
  </div>

  <div class="tabs">
    <div class="tab active" id="tab-reqs" onclick="switchTab('reqs')">Open Requisitions</div>
    <div class="tab" id="tab-subs" onclick="switchTab('subs')">My Submissions</div>
  </div>

  <div id="reqs-panel"><div class="loading">Loading…</div></div>
  <div id="subs-panel" style="display:none"><div class="loading">Loading…</div></div>
</div>

<!-- Submit CV modal -->
<div class="modal-bg" id="submit-modal" onclick="if(event.target===this) closeSubmitModal()">
  <div class="modal">
    <h3 id="sm-title">Submit a candidate</h3>
    <div class="sub" id="sm-sub"></div>
    <div id="sm-err" class="error-box" style="display:none"></div>
    <label for="sm-name">Candidate name</label>
    <input id="sm-name" placeholder="Full name">
    <label for="sm-email">Candidate email</label>
    <input id="sm-email" type="email" placeholder="candidate@example.com">
    <label for="sm-phone">Phone</label>
    <input id="sm-phone" placeholder="Optional">
    <label for="sm-gender">Gender</label>
    <select id="sm-gender">
      <option value="female">Female</option>
      <option value="male">Male</option>
      <option value="undisclosed" selected>Undisclosed</option>
    </select>
    <label for="sm-exp">Years of experience</label>
    <input id="sm-exp" type="number" step="0.5" min="0" placeholder="Optional">
    <label for="sm-file">Resume (PDF or Word)</label>
    <input id="sm-file" type="file" accept=".pdf,.doc,.docx">
    <div class="modal-actions">
      <button class="btn btn-ghost btn-sm" style="flex:1" onclick="closeSubmitModal()">Cancel</button>
      <button class="btn btn-sm" style="flex:1" id="sm-submit-btn" onclick="submitCv()">Submit</button>
    </div>
  </div>
</div>

<script>
const TOKEN_KEY = 'enternly_vendor_token';
const NAME_KEY  = 'enternly_vendor_name';
let currentReqId = null;

const STAGE_LABELS = {
  applied: 'Applied', nexai_bot: 'NexAI Interview', hired: 'Offer Accepted',
  offered: 'Offer Received', rejected: 'Not Progressing', on_hold: 'On Hold',
  documentation: 'Documentation Review',
};
function stageLabel(status) {
  return STAGE_LABELS[status] || String(status || '').replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
}
function statusClass(status) {
  if (status === 'rejected') return 'rejected';
  if (status === 'hired' || status === 'offered') return 'hired';
  return '';
}
function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function togglePw() {
  const input = document.getElementById('pw');
  const btn = document.querySelector('.pw-toggle');
  const show = input.type === 'password';
  input.type = show ? 'text' : 'password';
  btn.textContent = show ? '🙈' : '👁';
}

document.getElementById('pw').addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});

async function doLogin() {
  const email = document.getElementById('email').value.trim();
  const pw    = document.getElementById('pw').value;
  const err   = document.getElementById('err');
  const btn   = document.getElementById('btn');

  err.style.display = 'none';
  if (!email || !pw) {
    err.textContent = 'Please enter your email and password.';
    err.style.display = 'block';
    return;
  }

  btn.disabled = true; btn.textContent = 'Signing in…';
  try {
    const res  = await fetch('/api/vendors/portal/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password: pw }),
    });
    const data = await res.json();
    if (!res.ok) {
      err.textContent = data.detail || 'Sign in failed.';
      err.style.display = 'block';
      return;
    }
    localStorage.setItem(TOKEN_KEY, data.token);
    localStorage.setItem(NAME_KEY, data.name || '');
    showDashboard();
  } catch {
    err.textContent = 'Could not reach the server. Is the backend running?';
    err.style.display = 'block';
  } finally {
    btn.disabled = false; btn.textContent = 'Sign in';
  }
}

function logout() {
  localStorage.removeItem(TOKEN_KEY);
  localStorage.removeItem(NAME_KEY);
  document.getElementById('dash-screen').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
}

function authHeaders() {
  return { Authorization: 'Bearer ' + localStorage.getItem(TOKEN_KEY) };
}

function switchTab(tab) {
  document.getElementById('tab-reqs').classList.toggle('active', tab === 'reqs');
  document.getElementById('tab-subs').classList.toggle('active', tab === 'subs');
  document.getElementById('reqs-panel').style.display = tab === 'reqs' ? 'block' : 'none';
  document.getElementById('subs-panel').style.display = tab === 'subs' ? 'block' : 'none';
  if (tab === 'subs') loadSubmissions();
}

async function showDashboard() {
  const token = localStorage.getItem(TOKEN_KEY);
  if (!token) return;
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('dash-screen').style.display = 'block';
  document.getElementById('who').textContent = localStorage.getItem(NAME_KEY) || '';
  await loadRequisitions();
}

async function loadRequisitions() {
  const panel = document.getElementById('reqs-panel');
  panel.innerHTML = '<div class="loading">Loading…</div>';
  try {
    const res = await fetch('/api/vendors/portal/requisitions', { headers: authHeaders() });
    if (res.status === 401 || res.status === 403) { logout(); return; }
    const reqs = await res.json();
    if (!Array.isArray(reqs) || reqs.length === 0) {
      panel.innerHTML = '<div class="empty-state">No requisitions are currently open to you.</div>';
      return;
    }
    panel.innerHTML = reqs.map(r => `
      <div class="req-card">
        <div>
          <div class="req-title">${escapeHtml(r.title)}</div>
          <div class="req-meta">${escapeHtml(r.hiring_location || '')}${r.band ? ' · Band ' + escapeHtml(r.band) : ''}${r.business_unit ? ' · ' + escapeHtml(r.business_unit) : ''}${(r.min_experience != null && r.max_experience != null) ? ' · ' + r.min_experience + '-' + r.max_experience + ' yrs' : ''}</div>
          <div class="req-skills">${escapeHtml(r.key_skills || '')}</div>
        </div>
        <div class="req-actions">
          <span class="badge">${r.my_submissions || 0} submitted</span>
          <button class="btn btn-sm" onclick="openSubmitModal('${r.id}', ${JSON.stringify(r.title).replace(/"/g, '&quot;')})">Submit candidate</button>
        </div>
      </div>
    `).join('');
  } catch {
    panel.innerHTML = '<div class="empty-state">Could not reach the server. Please try again later.</div>';
  }
}

async function loadSubmissions() {
  const panel = document.getElementById('subs-panel');
  panel.innerHTML = '<div class="loading">Loading…</div>';
  try {
    const res = await fetch('/api/vendors/portal/submissions', { headers: authHeaders() });
    if (res.status === 401 || res.status === 403) { logout(); return; }
    const subs = await res.json();
    if (!Array.isArray(subs) || subs.length === 0) {
      panel.innerHTML = '<div class="empty-state">You have not submitted any candidates yet.</div>';
      return;
    }
    panel.innerHTML = subs.map(s => `
      <div class="sub-card">
        <div>
          <div class="sub-name">${escapeHtml(s.candidate_name)}</div>
          <div class="sub-meta">${escapeHtml(s.candidate_email || '')} · ${escapeHtml(s.requisition_title || '')}${s.applied_at ? ' · Applied ' + new Date(s.applied_at).toLocaleDateString() : ''}</div>
        </div>
        <span class="status-pill ${statusClass(s.status)}">${stageLabel(s.status)}</span>
      </div>
    `).join('');
  } catch {
    panel.innerHTML = '<div class="empty-state">Could not reach the server. Please try again later.</div>';
  }
}

function openSubmitModal(reqId, reqTitle) {
  currentReqId = reqId;
  document.getElementById('sm-sub').textContent = 'For: ' + reqTitle;
  document.getElementById('sm-name').value = '';
  document.getElementById('sm-email').value = '';
  document.getElementById('sm-phone').value = '';
  document.getElementById('sm-gender').value = 'undisclosed';
  document.getElementById('sm-exp').value = '';
  document.getElementById('sm-file').value = '';
  document.getElementById('sm-err').style.display = 'none';
  document.getElementById('submit-modal').classList.add('open');
}

function closeSubmitModal() {
  document.getElementById('submit-modal').classList.remove('open');
  currentReqId = null;
}

async function submitCv() {
  const name  = document.getElementById('sm-name').value.trim();
  const email = document.getElementById('sm-email').value.trim();
  const phone = document.getElementById('sm-phone').value.trim();
  const gender = document.getElementById('sm-gender').value;
  const exp   = document.getElementById('sm-exp').value;
  const file  = document.getElementById('sm-file').files[0];
  const err   = document.getElementById('sm-err');
  const btn   = document.getElementById('sm-submit-btn');

  err.style.display = 'none';
  if (!name || !email || !file) {
    err.textContent = 'Candidate name, email and a resume file are required.';
    err.style.display = 'block';
    return;
  }

  const form = new FormData();
  form.append('full_name', name);
  form.append('email', email);
  form.append('phone', phone);
  form.append('gender', gender);
  if (exp) form.append('years_experience', exp);
  form.append('file', file);

  btn.disabled = true; btn.textContent = 'Submitting…';
  try {
    const res = await fetch(`/api/vendors/portal/requisitions/${currentReqId}/submit`, {
      method: 'POST',
      headers: authHeaders(),
      body: form,
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      err.textContent = data.detail || 'Could not submit candidate.';
      err.style.display = 'block';
      return;
    }
    closeSubmitModal();
    await loadRequisitions();
  } catch {
    err.textContent = 'Could not reach the server. Please try again.';
    err.style.display = 'block';
  } finally {
    btn.disabled = false; btn.textContent = 'Submit';
  }
}

// Boot: already signed in? go straight to dashboard.
if (localStorage.getItem(TOKEN_KEY)) {
  showDashboard();
}
</script>
</body>
</html>
