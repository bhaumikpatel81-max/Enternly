<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a1628">
<title>Enternly — My Applications</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1a1d24; --paper: #f5f7fc; --card: #ffffff;
    --line: #e2e8f0; --accent: #1e63f2; --muted: #64748b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Space Grotesk', system-ui, sans-serif;
    background: var(--paper); color: var(--ink);
    min-height: 100vh;
  }
  /* ---- login screen ---- */
  #login-screen {
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 16px;
  }
  .box {
    background: var(--card); width: 100%; max-width: 480px;
    border: 1px solid var(--line); border-radius: 8px; overflow: hidden;
    box-shadow: 0 4px 24px rgba(30,99,242,0.10);
  }
  .box-top { padding: 28px 44px 22px; text-align: center; border-bottom: 4px solid var(--accent); }
  .logo { height: 120px; width: auto; margin-bottom: 10px; }
  .tagline { font-size: 11px; color: var(--accent); letter-spacing: 2px; text-transform: uppercase; font-weight: 600; }
  .box-body { padding: 28px 44px 24px; }
  h1 { font-size: 24px; font-weight: 700; margin-bottom: 16px; }
  .error-box {
    background: #fde8e4; border: 1px solid #f5b8ae; color: #8b2a1a;
    font-size: 14px; padding: 10px 14px; border-radius: 4px; margin-bottom: 14px;
  }
  label {
    display: block; font-size: 12px; text-transform: uppercase;
    letter-spacing: 1px; color: var(--muted); margin: 14px 0 5px; font-weight: 600;
  }
  input {
    width: 100%; padding: 11px 14px; border: 1px solid var(--line);
    border-radius: 6px; font-family: inherit; font-size: 16px;
    background: #f8faff; outline: none; transition: border-color 0.15s;
  }
  input:focus { border-color: var(--accent); background: #fff; }
  .pw-wrap { position: relative; }
  .pw-wrap input { padding-right: 42px; }
  .pw-toggle {
    position: absolute; top: 50%; right: 6px; transform: translateY(-50%);
    background: none; border: none; cursor: pointer; padding: 6px;
    line-height: 0; font-size: 18px; color: var(--muted);
  }
  .btn {
    width: 100%; margin-top: 22px; padding: 14px; background: var(--accent);
    color: #fff; border: none; border-radius: 6px; font-family: inherit;
    font-size: 17px; cursor: pointer; font-weight: 600; letter-spacing: 0.3px; transition: background 0.15s;
  }
  .btn:hover { background: #1750c9; }
  .btn:disabled { opacity: 0.6; cursor: not-allowed; }
  .powered-footer {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding: 16px; border-top: 1px solid var(--line); background: #f8faff;
  }
  .powered-footer span { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 1.2px; font-weight: 600; }
  .powered-footer img { height: 30px; width: auto; }

  /* ---- dashboard screen ---- */
  #dash-screen { display: none; max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; }
  .dash-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--line);
  }
  .dash-header .brand { display: flex; align-items: center; gap: 10px; }
  .dash-header img { height: 32px; }
  .dash-header h2 { font-size: 15px; font-weight: 700; }
  .dash-header .who { font-size: 13px; color: var(--muted); }
  .logout-link { font-size: 13px; color: var(--accent); text-decoration: none; font-weight: 600; cursor: pointer; }
  .logout-link:hover { text-decoration: underline; }
  .section-title { font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); font-weight: 600; margin-bottom: 12px; }
  .app-card {
    background: var(--card); border: 1px solid var(--line); border-radius: 8px;
    padding: 16px 20px; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .app-card .job-title { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
  .app-card .meta { font-size: 13px; color: var(--muted); }
  .status-pill {
    display: inline-block; padding: 6px 14px; border-radius: 999px;
    font-size: 12px; font-weight: 600; background: #e8f0fe; color: var(--accent); white-space: nowrap;
  }
  .status-pill.rejected { background: #fde8e4; color: #8b2a1a; }
  .status-pill.hired, .status-pill.offered { background: #e4f7ea; color: #1a5c2a; }
  .empty-state { text-align: center; color: var(--muted); padding: 48px 16px; font-size: 14px; }
  .loading { text-align: center; color: var(--muted); padding: 48px 16px; font-size: 14px; }

  @media (max-width: 540px) {
    .box { max-width: 100%; border-radius: 0; border-left: none; border-right: none; box-shadow: none; }
    .box-top { padding: 24px 24px 18px; }
    .box-body { padding: 20px 24px 20px; }
    .logo { height: 96px; }
    h1 { font-size: 22px; }
    .app-card { flex-direction: column; align-items: flex-start; }
  }
</style>
</head>
<body>

<div id="login-screen">
  <div class="box">
    <div class="box-top">
      <img src="/assets/Enternly_logo.png" alt="Enternly" class="logo">
      <div class="tagline">Embrace Generations to Next</div>
    </div>
    <div class="box-body">
      <h1>Candidate sign in</h1>
      <div id="err" class="error-box" style="display:none"></div>
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" placeholder="you@example.com">
      <label for="pw">Password</label>
      <div class="pw-wrap">
        <input id="pw" type="password" autocomplete="current-password" placeholder="••••••••">
        <button type="button" class="pw-toggle" tabindex="-1" aria-label="Show password" onclick="togglePw()">👁</button>
      </div>
      <button class="btn" id="btn" onclick="doLogin()">Sign in</button>
    </div>
    <div class="powered-footer">
      <span>Powered by</span>
      <img src="/assets/enternly-logo.png" alt="EnternsTech">
    </div>
  </div>
</div>

<div id="dash-screen">
  <div class="dash-header">
    <div class="brand">
      <img src="/assets/Enternly_logo.png" alt="Enternly">
      <div>
        <h2>My Applications</h2>
        <div class="who" id="who"></div>
      </div>
    </div>
    <a class="logout-link" onclick="logout()">Sign out</a>
  </div>
  <div class="section-title">Your submitted applications</div>
  <div id="apps-list"><div class="loading">Loading…</div></div>
</div>

<script>
const TOKEN_KEY = 'enternly_candidate_token';
const NAME_KEY  = 'enternly_candidate_name';

function togglePw() {
  const input = document.getElementById('pw');
  const btn = document.querySelector('.pw-toggle');
  const show = input.type === 'password';
  input.type = show ? 'text' : 'password';
  btn.textContent = show ? '🙈' : '👁';
}

document.getElementById('pw').addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});

async function doLogin() {
  const email = document.getElementById('email').value.trim();
  const pw    = document.getElementById('pw').value;
  const err   = document.getElementById('err');
  const btn   = document.getElementById('btn');

  err.style.display = 'none';
  if (!email || !pw) {
    err.textContent = 'Please enter your email and password.';
    err.style.display = 'block';
    return;
  }

  btn.disabled = true; btn.textContent = 'Signing in…';
  try {
    const res  = await fetch('/api/candidate/portal/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password: pw }),
    });
    const data = await res.json();
    if (!res.ok) {
      err.textContent = data.detail || 'Sign in failed.';
      err.style.display = 'block';
      return;
    }
    localStorage.setItem(TOKEN_KEY, data.token);
    localStorage.setItem(NAME_KEY, data.name || '');
    showDashboard();
  } catch {
    err.textContent = 'Could not reach the server. Is the backend running?';
    err.style.display = 'block';
  } finally {
    btn.disabled = false; btn.textContent = 'Sign in';
  }
}

function logout() {
  localStorage.removeItem(TOKEN_KEY);
  localStorage.removeItem(NAME_KEY);
  document.getElementById('dash-screen').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
}

function statusClass(status) {
  if (status === 'rejected') return 'rejected';
  if (status === 'hired' || status === 'offered') return 'hired';
  return '';
}

async function showDashboard() {
  const token = localStorage.getItem(TOKEN_KEY);
  if (!token) return;

  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('dash-screen').style.display = 'block';
  document.getElementById('who').textContent = localStorage.getItem(NAME_KEY) || '';

  const list = document.getElementById('apps-list');
  list.innerHTML = '<div class="loading">Loading…</div>';
  try {
    const res = await fetch('/api/candidate/portal/applications', {
      headers: { Authorization: 'Bearer ' + token },
    });
    if (res.status === 401 || res.status === 403) {
      logout();
      return;
    }
    const apps = await res.json();
    if (!Array.isArray(apps) || apps.length === 0) {
      list.innerHTML = '<div class="empty-state">You have no applications on file yet.</div>';
      return;
    }
    list.innerHTML = apps.map(a => `
      <div class="app-card">
        <div>
          <div class="job-title">${escapeHtml(a.job_title || '')}</div>
          <div class="meta">${escapeHtml(a.hiring_location || '')}${a.band ? ' · Band ' + escapeHtml(a.band) : ''}${a.applied_at ? ' · Applied ' + new Date(a.applied_at).toLocaleDateString() : ''}</div>
        </div>
        <span class="status-pill ${statusClass(a.status)}">${escapeHtml(a.stage_label || a.status || '')}</span>
      </div>
    `).join('');
  } catch {
    list.innerHTML = '<div class="empty-state">Could not reach the server. Please try again later.</div>';
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// Boot: already signed in? go straight to dashboard.
if (localStorage.getItem(TOKEN_KEY)) {
  showDashboard();
}
</script>
</body>
</html>
