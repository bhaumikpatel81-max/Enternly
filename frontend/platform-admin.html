<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#0A1F44">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Enternly — Platform Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
/* ── Design tokens + base component styles, cloned verbatim from
   index.html so the platform console is visually identical to the rest
   of Enternly -- this is NOT a separate design system. Trimmed to the
   subset this console actually uses (no Enteri AI/proctoring/gamification/
   custom-report-builder rules, which only the main app screens need). ── */
:root{
  --accent:#2563EB;--blue:#5FB4FF;--navy:#0A1F44;--purple:#2563EB;--sidebar:#0A1F44;
  --page:#F8FCFE;--card:#fff;--green:#0e9f6e;--border:#D7E0EC;--text:#0A1F44;--muted:#596A83;--gold:#b07d00;
  --text-heading:#0A1F44;--text-faint:#9AA7BD;--danger:#e2455a;
  --success-bg:#e8f7f0;--info-bg:#e7ecff;--warning-bg:#fff2d6;--purple-bg:#EAF0FF;
  --grad-hero:linear-gradient(100deg,#0A1F44 0%,#2563EB 130%);
  --grad-progress:linear-gradient(90deg,#2563EB,#22D3EE);
  --grad-bar:linear-gradient(90deg,#0A1F44,#2563EB);
  --grad-avatar:linear-gradient(150deg,#0A1F44,#2563EB);
  --font-head:'Space Grotesk',system-ui,-apple-system,sans-serif;
  --font-body:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
  --font-mono:'IBM Plex Mono',monospace;
}
:root{
  --bg:linear-gradient(180deg,#F4FAFF 0%,#F8FCFE 48%,#FFFFFF 100%);
  --surface:#FFFFFF;--surface2:#F8FCFE;--glass:rgba(255,255,255,.78);--bd:#D7E0EC;--bd2:#EDF2F8;
  --ink:#0A1F44;--ink2:#33445F;--ink3:#596A83;--ink4:#9AA7BD;
  --side:linear-gradient(190deg,#0A1F44 0%,#11305C 58%,#0A1F44 100%);
  --wash:#EAF0FF;--washfg:#2563EB;--hov:#F4FAFF;--signal:#0E9BB4;
  --orb1:rgba(37,99,235,.10);--orb2:rgba(34,211,238,.08);
  --shadow:0 1px 2px rgba(10,31,68,.05);--lift:0 18px 40px rgba(10,31,68,.13);--track:#E4EDF9;
  --accent:var(--washfg);--navy:var(--ink);--sidebar:var(--side);--page:var(--bg);
  --card:var(--surface);--text:var(--ink);--text-heading:var(--ink);--muted:var(--ink3);
  --border:var(--bd);--info-bg:var(--wash);--gold:#B07D00;
}
body[data-theme="dark"]{
  background:#050F24;color:#F2F7FF;
  --bg:radial-gradient(1000px 620px at 16% -6%,#14316B 0%,#0A1F44 46%,#050F24 100%);
  --surface:rgba(255,255,255,.06);--surface2:rgba(5,15,36,.34);--glass:rgba(255,255,255,.07);--bd:rgba(255,255,255,.13);--bd2:rgba(255,255,255,.08);
  --ink:#F2F7FF;--ink2:#C3D0E6;--ink3:#AFC0CD;--ink4:#7E93B4;
  --side:linear-gradient(190deg,#081A3A 0%,#0C2350 60%,#050F24 100%);
  --wash:rgba(34,211,238,.16);--washfg:#22D3EE;--hov:rgba(255,255,255,.05);--signal:#22D3EE;
  --orb1:rgba(37,99,235,.26);--orb2:rgba(34,211,238,.18);
  --shadow:0 1px 2px rgba(0,0,0,.3);--lift:0 22px 50px rgba(3,10,26,.55);--track:rgba(255,255,255,.12);
  --accent:var(--washfg);--navy:var(--ink);--sidebar:var(--side);--page:var(--bg);
  --card:var(--surface);--text:var(--ink);--text-heading:var(--ink);--muted:var(--ink3);
  --border:var(--bd);--info-bg:var(--wash);--gold:#E9BF57;
}
body[data-theme="dark"] a{color:#7FB0FF}
body[data-theme="dark"] .btn-primary{background:linear-gradient(90deg,#2563EB,#22D3EE);color:#04142E}
::-webkit-scrollbar-thumb{background:rgba(130,155,195,.45);border-radius:99px;border:3px solid transparent;background-clip:content-box}
@keyframes riseIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms !important;animation-iteration-count:1 !important;scroll-behavior:auto !important}
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-body);background:var(--page);color:var(--text);display:flex;height:100vh;overflow:hidden;font-size:14px}
h1,h2,h3,.card-title,.page-header h1,.modal h2,#topbar .screen-title,.stat-box .sv,.stage-card .n{font-family:var(--font-head)}
.card-title,.page-header h1,.modal h2,#topbar .screen-title{color:var(--text-heading)}
a{color:var(--accent)}
a:hover{color:var(--navy)}
#sidebar{width:214px;min-width:214px;background:var(--sidebar);display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden}
#sidebar .logo-area{height:auto;padding:18px 18px 14px;border-bottom:none;display:flex;flex-direction:row;align-items:center;justify-content:flex-start;gap:8px;background:transparent;overflow:visible;flex-shrink:0}
#sidebar .logo-area .logo-chip{background:#fff;border-radius:10px;padding:7px 9px;display:inline-flex;flex-shrink:0}
#sidebar .logo-area img{height:34px;width:auto;max-width:100%;display:block}
#sidebar .logo-area .logo-sub{font-size:9px;font-weight:700;letter-spacing:2px;color:rgba(255,255,255,.5);text-transform:uppercase}
#sidebar nav{padding:6px 12px;flex:1;display:flex;flex-direction:column}
.nav-item{display:flex;align-items:center;gap:10px;padding:11px 12px;margin:1px 0;border-radius:8px;color:rgba(255,255,255,.7);cursor:pointer;border-left:3px solid transparent;font-size:13px;font-weight:600;min-height:22px;transition:background .25s,color .25s;white-space:nowrap}
.nav-item:hover{background:rgba(255,255,255,.08);color:#fff}
.nav-item.active{border-left-color:#22D3EE;background:rgba(37,99,235,.24);color:#fff;font-weight:700}
.nav-item.danger{color:#ff8fa3}
.nav-spacer{flex:1}
.nav-sep{height:1px;background:rgba(255,255,255,.1);margin:8px 12px}
.nav-icon{font-size:12px;width:21px;height:21px;border-radius:7px;text-align:center;line-height:21px;flex-shrink:0;background:rgba(255,255,255,.08);transition:background .25s}
.nav-item.active .nav-icon{background:linear-gradient(140deg,#22D3EE,#2563EB)}
.nav-group-label{font-family:var(--font-head);font-size:10px;text-transform:uppercase;letter-spacing:1.4px;color:rgba(255,255,255,.42);padding:14px 12px 6px;font-weight:700}
.sidebar-powered{padding:14px 16px 16px;display:flex;flex-direction:column;gap:3px;border-top:1px solid rgba(255,255,255,.1)}
.sidebar-powered .pw-label{font-family:var(--font-mono);font-size:9px;color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:1.5px;font-weight:700}
.sidebar-powered .pw-wordmark{font-family:var(--font-head);font-weight:800;letter-spacing:2.5px;color:rgba(255,255,255,.6);font-size:12px}
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
#topbar{height:56px;background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 28px;gap:16px;flex-shrink:0}
#topbar .screen-title{font-weight:600;font-size:16px;flex:1}
.user-chip{display:flex;align-items:center;gap:10px}
.user-chip .uname{font-size:13px;color:var(--muted)}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--grad-avatar);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12.5px;flex-shrink:0;cursor:pointer}
.theme-toggle-btn{height:34px;padding:0 13px;border:1px solid var(--border);border-radius:20px;background:transparent;color:var(--muted);font-family:var(--font-body);font-size:11.5px;font-weight:600;cursor:pointer;white-space:nowrap;transition:border-color .25s,color .25s}
.theme-toggle-btn:hover{border-color:var(--accent);color:var(--accent)}
#content{flex:1;overflow-y:auto;padding:28px 32px;background:var(--page)}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;animation:riseIn .35s ease both}
.card-title{font-size:14px;font-weight:600;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.stage-grid{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px}
.stage-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:15px 12px;text-align:center;flex:1;min-width:72px;box-shadow:var(--shadow);transition:transform .3s cubic-bezier(.2,.8,.25,1),box-shadow .3s,border-color .3s;animation:riseIn .35s ease both}
.stage-card.dash-link{cursor:pointer}
.stage-card.dash-link:hover{transform:translateY(-4px);box-shadow:var(--lift);border-color:var(--accent)}
.stage-card .n{font-size:26px;font-weight:700;line-height:1.1}
.stage-card .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin-top:3px;line-height:1.3}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);padding:8px 10px;border-bottom:2px solid var(--border)}
td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--hov)}
.clickable-row{cursor:pointer}
.pill{display:inline-block;padding:2px 9px;border-radius:10px;font-size:11px;text-transform:uppercase;letter-spacing:.4px;font-weight:500}
.pill.open,.pill.active{background:#e8f7f0;color:var(--green)}
.pill.closed,.pill.cancelled,.pill.inactive{background:#F8FCFE;color:var(--muted)}
.pill.trial{background:#fff2d6;color:var(--gold)}
.pill.suspended,.pill.deleted,.pill.expired{background:#fdeaee;color:#e2455a}
.pill.resolved,.pill.done{background:#e8f7f0;color:var(--green);font-weight:600}
.pill.in_progress{background:var(--wash);color:var(--washfg)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border:none;border-radius:4px;font-family:inherit;font-size:13px;cursor:pointer;font-weight:500;transition:background .12s}
.btn-primary{background:var(--navy);color:#fff}.btn-primary:hover{background:#002a7a}
.btn-ghost{background:transparent;color:var(--text);border:1px solid var(--border)}.btn-ghost:hover{background:var(--border)}
.btn-danger{background:transparent;color:#e2455a;border:1px solid #e2455a}.btn-danger:hover{background:#e2455a;color:#fff}
.btn-green{background:var(--green);color:#fff}.btn-green:hover{background:#0b7d58}
.btn-sm{padding:4px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);margin-bottom:4px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:4px;font-family:inherit;font-size:13px;background:var(--card);color:var(--text);outline:none;transition:border-color .12s}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--accent)}
.form-group textarea{min-height:60px;resize:vertical}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.page-header{display:flex;align-items:center;gap:12px;margin-bottom:24px;flex-wrap:wrap}
.page-header h1{font-size:20px;font-weight:600;flex:1}
.empty{text-align:center;padding:40px;color:var(--muted);font-size:14px}
.flash{position:fixed;top:0;left:0;right:0;padding:12px 24px;color:#fff;font-size:14px;z-index:9999;text-align:center}
.flash-ok{background:var(--green)}.flash-err{background:var(--accent)}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:500;align-items:center;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:28px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.12)}
.modal h2{font-size:17px;font-weight:600;margin-bottom:18px}
.modal-btns{display:flex;gap:10px;margin-top:20px;justify-content:flex-end}
.tabs{display:flex;gap:4px;margin-bottom:16px;flex-wrap:wrap}
.tab{padding:6px 14px;border:1px solid var(--border);border-radius:4px;cursor:pointer;font-size:13px;background:var(--card);transition:background .1s}
.tab.active,.tab:hover{background:var(--text);color:#fff;border-color:var(--text)}
.chart-wrap{position:relative;height:240px;margin-top:8px}
.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.stat-box{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:16px;text-align:center}
.stat-box .sv{font-size:28px;font-weight:700;color:var(--navy)}
.stat-box .sl{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-top:4px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.inline-btns{display:flex;gap:6px;flex-wrap:wrap}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.badge-green{background:#e8f7f0;color:var(--green)}.badge-orange{background:#fff2d6;color:var(--gold)}.badge-red{background:#fdeaee;color:#e2455a}.badge-blue{background:var(--info-bg);color:var(--accent)}
.rag-dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex-shrink:0;vertical-align:middle;cursor:default}
.rag-dot.green{background:#0e9f6e}.rag-dot.amber{background:#b07d00}.rag-dot.red{background:#e2455a}
.rag-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px;cursor:default;white-space:nowrap}
.rag-badge.green{background:#e8f7f0;color:#0e9f6e}.rag-badge.amber{background:#fff2d6;color:#b07d00}.rag-badge.red{background:#fdeaee;color:#e2455a}
@media(max-width:768px){.form-row,.two-col,.chart-grid,.stat-row{grid-template-columns:1fr}}
*{-webkit-tap-highlight-color:transparent}
a,button,[role="button"]{touch-action:manipulation}
select{background-image:none}
@supports(height:100dvh){body{height:100dvh}}
@supports(-webkit-touch-callout:none){
  body{height:-webkit-fill-available}
  #sidebar{min-height:-webkit-fill-available}
}
#menu-btn{display:none;background:none;border:none;cursor:pointer;padding:6px 8px;color:var(--text);font-size:22px;line-height:1;flex-shrink:0;touch-action:manipulation;-webkit-appearance:none}
#sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:299}
@media(min-width:769px) and (max-width:1024px){
  #sidebar{width:170px;min-width:170px}
  .nav-item{padding:10px 14px;font-size:12px}
  #content{padding:20px 22px}
  .stat-row{grid-template-columns:repeat(3,1fr)}
  .stage-card .n{font-size:22px}
}
@media(max-width:768px){
  body{height:auto;min-height:100vh;overflow-x:hidden;overflow-y:auto;display:block}
  #sidebar{position:fixed;top:0;left:0;bottom:0;height:100%;width:240px;min-width:240px;z-index:300;transform:translateX(-100%);transition:transform .25s cubic-bezier(.4,0,.2,1);will-change:transform;overflow-y:auto}
  #sidebar.mob-open{transform:translateX(0)}
  #sidebar-overlay.mob-open{display:block}
  #menu-btn{display:flex;align-items:center;justify-content:center}
  #main{width:100%;overflow:visible;min-height:100vh}
  #content{overflow-y:visible;padding:12px 14px;padding-bottom:env(safe-area-inset-bottom,12px)}
  #topbar{padding:0 10px 0 6px;gap:8px}
  #topbar .screen-title{font-size:14px}
  .user-chip .uname{display:none}
  .theme-toggle-btn{width:34px;padding:0;font-size:0}
  .theme-toggle-btn::before{content:"🌓";font-size:15px}
  .stage-grid{flex-wrap:nowrap;overflow-x:auto;padding-bottom:8px;scrollbar-width:none;gap:6px;margin-right:-14px;padding-right:14px}
  .stage-grid::-webkit-scrollbar{display:none}
  .stage-card{min-width:80px;flex-shrink:0}
  .stage-card .n{font-size:22px}
  .stat-row{grid-template-columns:repeat(2,1fr)}
  .form-row,.two-col,.chart-grid{grid-template-columns:1fr}
  .card{overflow-x:auto}
  table{min-width:480px}
  .page-header{flex-direction:column;align-items:flex-start;gap:8px;margin-bottom:16px}
  .page-header h1{font-size:18px}
  .modal-bg.open{align-items:flex-end;padding:0}
  .modal{max-width:100%;width:100%;border-radius:12px 12px 0 0;max-height:88vh;margin:0;padding:20px 18px}
  .modal-btns{flex-direction:column-reverse;gap:8px}
  .modal-btns button{width:100%;justify-content:center}
  .nav-item{padding:13px 20px;min-height:48px}
  .btn{min-height:40px}
  .btn-sm{padding:7px 12px;min-height:34px}
  .inline-btns{flex-wrap:wrap}
  .chart-wrap{height:200px!important}
  .tabs{flex-wrap:wrap}
}
@media screen and (-webkit-min-device-pixel-ratio:0) and (max-width:768px){
  input[type="text"],input[type="email"],input[type="password"],
  input[type="number"],input[type="tel"],input[type="search"],
  input[type="url"],select,textarea{font-size:16px!important}
}
@media(max-width:400px){
  #content{padding:10px}
  .stage-card{min-width:70px}
  .stat-box .sv{font-size:22px}
}
/* ── Platform-console-only: impersonation is initiated from here but lives
   in index.html; no local rules needed for it. ── */
a:focus-visible,button:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible,.nav-item:focus-visible,.pill:focus-visible,.form-group input:focus-visible,.form-group select:focus-visible,.form-group textarea:focus-visible{outline:2px solid #2563EB;outline-offset:2px}
</style>
</head>
<body>

<div id="sidebar-overlay" aria-hidden="true"></div>
<div id="sidebar">
  <div class="logo-area">
    <span class="logo-chip"><img src="/assets/Enternly_logo.png" alt="Enternly"></span>
    <span class="logo-sub">Platform</span>
  </div>
  <nav id="sidenav"></nav>
</div>

<div id="main">
  <div id="topbar">
    <button id="menu-btn" aria-label="Open navigation menu" aria-expanded="false">&#9776;</button>
    <div class="screen-title" id="topbar-title">Dashboard</div>
    <div class="user-chip">
      <button id="theme-toggle-btn" class="theme-toggle-btn" onclick="toggleTheme()" title="Switch color theme">🌙 Dark mode</button>
      <span class="uname" id="topbar-name"></span>
      <div class="avatar" id="topbar-avatar" onclick="logout()" title="Click to sign out"></div>
    </div>
  </div>
  <div id="content"><p class="empty">Loading…</p></div>
</div>

<!-- ── Create company modal (Feature C) ── -->
<div class="modal-bg" id="create-tenant-modal" onmousedown="modalBgMouseDown(event)" onclick="modalBgClick(event,closeCreateTenantModal)">
  <div class="modal">
    <h2>New company</h2>
    <div class="form-group"><label>Company name</label><input id="ct-name" placeholder="Acme Corp"></div>
    <div class="form-group"><label>Type</label>
      <select id="ct-type"><option value="Company">Company</option><option value="College">College</option></select>
    </div>
    <div class="form-group"><label>Admin full name</label><input id="ct-admin-name" placeholder="Jane Doe"></div>
    <div class="form-group"><label>Admin email</label><input id="ct-admin-email" type="email" placeholder="jane@acme.com"></div>
    <div class="modal-btns">
      <button class="btn btn-ghost" onclick="closeCreateTenantModal()">Cancel</button>
      <button class="btn btn-primary" onclick="doCreateTenant()">Create company</button>
    </div>
  </div>
</div>

<!-- ── Edit company modal (Feature C) ── -->
<div class="modal-bg" id="edit-tenant-modal" onmousedown="modalBgMouseDown(event)" onclick="modalBgClick(event,closeEditTenantModal)">
  <div class="modal">
    <h2>Edit company</h2>
    <div class="form-group"><label>Company name</label><input id="et-name"></div>
    <div class="form-group"><label>Slug</label><input id="et-slug"></div>
    <div class="form-group"><label>Logo URL</label><input id="et-logo" placeholder="https://…"></div>
    <div class="form-group"><label>Primary colour</label><input id="et-colour" placeholder="#2563EB"></div>
    <div class="modal-btns">
      <button class="btn btn-ghost" onclick="closeEditTenantModal()">Cancel</button>
      <button class="btn btn-primary" onclick="doEditTenant()">Save</button>
    </div>
  </div>
</div>

<!-- ── Subscription modal (Feature E) ── -->
<div class="modal-bg" id="subscription-modal" onmousedown="modalBgMouseDown(event)" onclick="modalBgClick(event,closeSubscriptionModal)">
  <div class="modal">

<script>
// Same click-outside-to-close guard as index.html (against the native
// <select> click-through quirk) -- reused verbatim so future modal screens
// (tenant create/edit, module toggles, etc.) behave identically.
let _modalBgMouseDownOnSelf = false;
function modalBgMouseDown(e){ _modalBgMouseDownOnSelf = (e.target === e.currentTarget); }
function modalBgClick(e, closeFn){
  if (e.target === e.currentTarget && _modalBgMouseDownOnSelf) closeFn();
  _modalBgMouseDownOnSelf = false;
}

// ── Auth ──────────────────────────────────────────────────────────────────────
// Deliberately a SEPARATE localStorage key from index.html's 'enternly_token'
// -- index.html's NAV_DEF has no platform_admin/company_admin entry and would
// silently fall back to the recruiter nav if it ever decoded a platform
// token, and a platform session must be able to coexist in another tab with
// an impersonated staff session without either clobbering the other.
const _tok = localStorage.getItem('enternly_platform_token');
function _jwt(t) {
  try { return JSON.parse(atob(t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))); }
  catch { return null; }
}
const ME = _tok ? _jwt(_tok) : null;
if (!ME || !ME.platform) {
  localStorage.removeItem('enternly_platform_token');
  window.location.replace('/platform-login');
  throw '';
}

// ── Theme (shared preference with the main app -- purely cosmetic, not a
// security boundary, so reusing the same key is intentional) ──────────────────
function _preferredTheme() {
  const stored = localStorage.getItem('enternly_theme');
  if (stored === 'dark' || stored === 'light') return stored;
  return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}
function initTheme() {
  const t = _preferredTheme();
  document.body.setAttribute('data-theme', t);
  const btn = document.getElementById('theme-toggle-btn');
  if (btn) btn.textContent = t === 'dark' ? '☀ Light mode' : '🌙 Dark mode';
}
function toggleTheme() {
  const next = document.body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  document.body.setAttribute('data-theme', next);
  localStorage.setItem('enternly_theme', next);
  const btn = document.getElementById('theme-toggle-btn');
  if (btn) btn.textContent = next === 'dark' ? '☀ Light mode' : '🌙 Dark mode';
}
initTheme();
if (window.matchMedia) {
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    if (!localStorage.getItem('enternly_theme')) initTheme();
  });
}

// ── API (identical shape to index.html's api(), pointed at the platform
// token instead) ────────────────────────────────────────────────────────────
let _lastApiError = null;
async function api(path, opts = {}) {
  _lastApiError = null;
  if (opts.body && typeof opts.body === 'object' && !(opts.body instanceof FormData)) {
    opts.body = JSON.stringify(opts.body);
    opts.headers = { ...opts.headers, 'Content-Type': 'application/json' };
  }
  opts.headers = { ...opts.headers, Authorization: `Bearer ${_tok}` };
  let r;
  try { r = await fetch(path, opts); }
  catch (e) {
    flash('Network error. Retrying…', false);
    await new Promise(res => setTimeout(res, 2000));
    try { r = await fetch(path, opts); } catch { flash('Server unreachable.', false); return null; }
  }
  if (r.status === 401) { logout(); return null; }
  if (!r.ok) {
    let d = `HTTP ${r.status}`;
    try { const j = await r.clone().json(); d = j.detail || d; } catch {}
    console.error('API error:', path, d);
    _lastApiError = typeof d === 'string' ? d : JSON.stringify(d);
    return null;
  }
  const ct = r.headers.get('content-type') || '';
  if (!ct.includes('json')) return null;
  return r.json();
}
async function apiOrWarn(path, opts, fallback, label) {
  const res = await api(path, opts);
  if (res === null && _lastApiError) {
    flash(`Could not load ${label || 'this'} — ${_lastApiError}. Showing empty/default state.`, false);
    return fallback;
  }
  return res === null ? fallback : res;
}
function flash(msg, ok = true) {
  const el = document.createElement('div');
  el.className = `flash ${ok ? 'flash-ok' : 'flash-err'}`;
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 4000);
}
function logout() { localStorage.removeItem('enternly_platform_token'); window.location.replace('/platform-login'); }
function esc(v) { return String(v ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escAttr(v) { return esc(v).replace(/'/g,'&#39;'); }
function showErr(msg) { document.getElementById('content').innerHTML = `<p class="empty">${esc(msg || 'Something went wrong.')}</p>`; }

// ── Nav / routing ────────────────────────────────────────────────────────────
// Flat list (no role branching -- every account that reaches this console is
// already a platform superadmin, enforced both by require_platform_admin on
// every /api/platform/* route and by the auth guard above).
const NAV_ITEMS = [
  {id:'dashboard',    icon:'⬛', label:'Dashboard'},
  {id:'companies',    icon:'🏢', label:'Companies'},
  {id:'subscriptions',icon:'💳', label:'Subscriptions'},
  {id:'all_users',    icon:'👥', label:'All Users'},
  {id:'tickets',      icon:'🎫', label:'Issues & Tickets'},
  {id:'audit',        icon:'📋', label:'Audit Logs'},
  {id:'analytics',    icon:'📈', label:'Usage Analytics'},
  {id:'modules',      icon:'🧩', label:'Module Catalog'},
  {id:'sys_health',   icon:'🖥️', label:'System Health'},
  {id:'settings',     icon:'⚙️', label:'Settings'},
];

function screenComingSoon(label) {
  document.getElementById('content').innerHTML =
    `<div class="page-header"><h1>${esc(label)}</h1></div>
     <div class="card"><p class="empty">This screen lands in a later commit.</p></div>`;
}

// ── Dashboard (Feature B) ────────────────────────────────────────────────────

    <div class="page-header"><h1>Dashboard</h1></div>
    <div class="stage-grid">
      <div class="stage-card dash-link" onclick="navigate('companies')"><div class="n">${s.totalTenants}</div><div class="lbl">Companies</div></div>
      <div class="stage-card dash-link" onclick="navigate('companies')"><div class="n">${s.activeTenants}</div><div class="lbl">Active</div></div>
      <div class="stage-card dash-link" onclick="navigate('all_users')"><div class="n">${s.totalUsers}</div><div class="lbl">Total Users</div></div>
      <div class="stage-card"><div class="n">${s.newTenantsThisMonth}</div><div class="lbl">New This Month</div></div>
      <div class="stage-card"><div class="n">${s.totalCandidates.toLocaleString()}</div><div class="lbl">Candidate Pool</div></div>

    <div class="card"><p class="empty">Companies, Subscriptions, Users, and the rest of the console are on the left.</p></div>`;

// ── Companies (Feature C) ────────────────────────────────────────────────────
function _tenantPill(t) {
  if (t.is_deleted) return '<span class="pill deleted">Deleted</span>';
  return `<span class="pill ${t.status}">${esc(t.status)}</span>`;
}

async function screenCompanies(param) {
  if (param) return screenCompanyDetail(param);
  setTitle('Companies');
  const tenants = await api('/api/platform/tenants');
  if (!tenants) { showErr('Could not load companies.'); return; }
  const rows = tenants.map(t => `
    <tr class="clickable-row" onclick="navigate('companies','${t.id}')">
      <td><strong>${esc(t.name)}</strong><br><span style="font-size:11px;color:var(--muted)">${esc(t.tenant_code||'')}</span></td>
      <td>${esc(t.tenant_type)}</td>
      <td>${_tenantPill(t)}</td>
      <td>${esc(t.subscription_plan||'')}</td>
      <td>${t.employee_count}</td>
      <td>${t.created_at ? new Date(t.created_at).toLocaleDateString() : '—'}</td>
    </tr>`).join('');
  document.getElementById('content').innerHTML = `
    <div class="page-header"><h1>Companies</h1><button class="btn btn-primary" onclick="openCreateTenantModal()">+ New company</button></div>
    <div class="card" style="padding:0;overflow:hidden">
      ${rows ? `<table><thead><tr><th>Name</th><th>Type</th><th>Status</th><th>Plan</th><th>Users</th><th>Created</th></tr></thead><tbody>${rows}</tbody></table>` : '<p class="empty">No companies yet.</p>'}
    </div>`;
}

async function screenCompanyDetail(id) {
  setTitle('Company');
  const t = await api(`/api/platform/tenants/${id}`);
  if (!t) { showErr('Could not load company.'); return; }
  const userRows = (t.users||[]).map(u => `
    <tr><td>${esc(u.full_name)}<br><span style="font-size:11px;color:var(--muted)">${esc(u.email)}</span></td>
        <td>${esc(u.role)}</td>
        <td><span class="pill ${u.is_active?'active':'inactive'}">${u.is_active?'Active':'Inactive'}</span></td>
        <td>${u.last_login_at ? new Date(u.last_login_at).toLocaleDateString() : '—'}</td></tr>`).join('');
  const placementBtn = t.tenant_type === 'College'
    ? `<button class="btn btn-ghost btn-sm" onclick="openAddTenantUserModal('${t.id}','placement-officers')">+ Add placement officer</button>` : '';
  document.getElementById('content').innerHTML = `
    <div class="page-header">
      <h1>${esc(t.name)} <span style="font-size:12px;color:var(--muted)">${esc(t.tenant_code||'')}</span></h1>
      <button class="btn btn-ghost" onclick="navigate('companies')">← Back</button>
      <button class="btn btn-ghost" onclick="openEditTenantModal('${t.id}','${escAttr(t.name)}','${escAttr(t.slug)}','${escAttr(t.logo_url||'')}','${escAttr(t.primary_colour||'')}')">Edit</button>
      <button class="btn btn-ghost" onclick="openSubscriptionModal('${t.id}','${escAttr(t.subscription_plan||'')}','${t.subscription_end_date||''}')">Subscription</button>
      ${t.status !== 'suspended'
        ? `<button class="btn btn-danger" onclick="setTenantStatus('${t.id}','suspended')">Suspend</button>`
        : `<button class="btn btn-green" onclick="setTenantStatus('${t.id}','active')">Reactivate</button>`}
      <button class="btn btn-danger" onclick="deleteTenant('${t.id}','${escAttr(t.name)}')">Delete</button>
    </div>
    <div class="stat-row">
      <div class="stat-box"><div class="sv">${_tenantPill(t)}</div><div class="sl">Status</div></div>
      <div class="stat-box"><div class="sv">${esc(t.tenant_type)}</div><div class="sl">Type</div></div>
      <div class="stat-box"><div class="sv">${esc(t.subscription_plan||'—')}</div><div class="sl">Plan</div></div>
      <div class="stat-box"><div class="sv">${(t.users||[]).length}</div><div class="sl">Users</div></div>
    </div>
    <div class="page-header" style="margin-top:8px"><h1 style="font-size:16px">Users</h1>
      <button class="btn btn-ghost btn-sm" onclick="openAddTenantUserModal('${t.id}','admins')">+ Add company admin</button>
      ${placementBtn}
    </div>
    <div class="card" style="padding:0;overflow:hidden">
      ${userRows ? `<table><thead><tr><th>Name</th><th>Role</th><th>Status</th><th>Last login</th></tr></thead><tbody>${userRows}</tbody></table>` : '<p class="empty">No users yet.</p>'}
    </div>
    <div class="page-header" style="margin-top:8px"><h1 style="font-size:16px">Modules</h1></div>
    <div class="card" id="tenant-modules-card"><p class="empty">Loading…</p></div>`;
  _loadTenantModules(id);
}

async function _loadTenantModules(tenantId) {
  const mods = await api(`/api/platform/tenants/${tenantId}/modules`);
  const card = document.getElementById('tenant-modules-card');
  if (!mods) { card.innerHTML = '<p class="empty">Could not load modules.</p>'; return; }
  const rows = mods.map(m => `
    <label class="chip-toggle" style="margin:4px 8px 4px 0;display:inline-flex">
      <input type="checkbox" data-module="${m.key}" ${m.is_enabled ? 'checked' : ''} onchange="_toggleTenantModule('${tenantId}',this)">
      <span>${esc(m.icon||'')} ${esc(m.label)}</span>
    </label>`).join('');
  card.innerHTML = `<div style="display:flex;flex-wrap:wrap">${rows}</div>`;
}

async function _toggleTenantModule(tenantId, checkbox) {
  const key = checkbox.dataset.module;
  const enabled = checkbox.checked;
  const res = await api(`/api/platform/tenants/${tenantId}/modules`, { method: 'PUT', body: { modules: { [key]: enabled } } });
  if (res) { flash('Module updated.'); }
  else { checkbox.checked = !enabled; flash(_lastApiError || 'Could not update module — check the plan allows it.', false); }
}

function openCreateTenantModal() {
  document.getElementById('ct-name').value = '';
  document.getElementById('ct-type').value = 'Company';
  document.getElementById('ct-admin-name').value = '';
  document.getElementById('ct-admin-email').value = '';
  document.getElementById('create-tenant-modal').classList.add('open');
}
function closeCreateTenantModal() { document.getElementById('create-tenant-modal').classList.remove('open'); }
async function doCreateTenant() {
  const body = {
    name: document.getElementById('ct-name').value.trim(),
    tenant_type: document.getElementById('ct-type').value,
    admin_full_name: document.getElementById('ct-admin-name').value.trim(),
    admin_email: document.getElementById('ct-admin-email').value.trim(),
  };
  if (!body.name || !body.admin_full_name || !body.admin_email) { flash('Fill in all fields.', false); return; }
  const res = await api('/api/platform/tenants', { method: 'POST', body });
  if (res && res.id) {
    flash(`Company created — code ${res.tenant_code}.${res.setup_email_sent ? '' : ' (setup email not sent — check email config)'}`);
    closeCreateTenantModal();
    navigate('companies', res.id);
  } else flash(res?.detail || _lastApiError || 'Could not create company.', false);
}

let _editTenantId = null;
function openEditTenantModal(id, name, slug, logo, colour) {
  _editTenantId = id;
  document.getElementById('et-name').value = name;
  document.getElementById('et-slug').value = slug;
  document.getElementById('et-logo').value = logo;
  document.getElementById('et-colour').value = colour;
  document.getElementById('edit-tenant-modal').classList.add('open');
}
function closeEditTenantModal() { document.getElementById('edit-tenant-modal').classList.remove('open'); }
async function doEditTenant() {
  const body = {
    name: document.getElementById('et-name').value.trim(),
    slug: document.getElementById('et-slug').value.trim(),
    logo_url: document.getElementById('et-logo').value.trim() || null,
    primary_colour: document.getElementById('et-colour').value.trim() || null,
  };
  const res = await api(`/api/platform/tenants/${_editTenantId}`, { method: 'PUT', body });
  if (res && res.id) { flash('Saved.'); closeEditTenantModal(); navigate('companies', _editTenantId); }
  else flash(res?.detail || _lastApiError || 'Could not save.', false);
}

async function setTenantStatus(id, status) {
  if (!confirm(`${status === 'suspended' ? 'Suspend' : 'Reactivate'} this company? Its users will ${status === 'suspended' ? 'immediately lose' : 'regain'} access.`)) return;
  const res = await api(`/api/platform/tenants/${id}/status`, { method: 'PATCH', body: { status } });
  if (res && res.id) { flash('Status updated.'); navigate('companies', id); }
  else flash(res?.detail || _lastApiError || 'Could not update status.', false);
}

async function deleteTenant(id, name) {
  if (!confirm(`Delete "${name}"? This soft-deletes the company — its users can no longer log in. This cannot be undone from the console.`)) return;
  const res = await api(`/api/platform/tenants/${id}`, { method: 'DELETE' });
  if (res && res.ok) { flash('Company deleted.'); navigate('companies'); }
  else flash(res?.detail || _lastApiError || 'Could not delete company.', false);
}

let _addUserTenantId = null, _addUserKind = 'admins';
function openAddTenantUserModal(tenantId, kind) {
  _addUserTenantId = tenantId; _addUserKind = kind;
  document.getElementById('atu-title').textContent = kind === 'placement-officers' ? 'Add placement officer' : 'Add company admin';
  document.getElementById('atu-name').value = '';
  document.getElementById('atu-email').value = '';
  document.getElementById('add-tenant-user-modal').classList.add('open');
}
function closeAddTenantUserModal() { document.getElementById('add-tenant-user-modal').classList.remove('open'); }
async function doAddTenantUser() {
  const body = {
    full_name: document.getElementById('atu-name').value.trim(),
    email: document.getElementById('atu-email').value.trim(),
  };
  if (!body.full_name || !body.email) { flash('Fill in all fields.', false); return; }
  const res = await api(`/api/platform/tenants/${_addUserTenantId}/${_addUserKind}`, { method: 'POST', body });
  if (res && res.id) { flash('User added.'); closeAddTenantUserModal(); navigate('companies', _addUserTenantId); }
  else flash(res?.detail || _lastApiError || 'Could not add user.', false);
}

// ── Module Catalog (Feature D) ────────────────────────────────────────────────
async function screenModuleCatalog() {
  setTitle('Module Catalog');
  const mods = await api('/api/platform/modules');
  if (!mods) { showErr('Could not load module catalog.'); return; }
  const rows = mods.map(m => `
    <tr>
      <td>${esc(m.icon||'')} <strong>${esc(m.label)}</strong><br><span style="font-size:11px;color:var(--muted);font-family:var(--font-mono)">${esc(m.key)}</span></td>
      <td>${esc(m.group||'—')}</td>
      <td><span class="pill ${m.is_active?'active':'inactive'}">${m.is_active?'Active':'Disabled'}</span></td>
      <td>${m.is_active ? `<button class="btn btn-danger btn-sm" onclick="disableModule('${m.key}')">Disable</button>` : ''}</td>
    </tr>`).join('');
  document.getElementById('content').innerHTML = `
    <div class="page-header"><h1>Module Catalog</h1></div>
    <div class="card"><p class="empty" style="padding:0 0 14px;text-align:left">Modules toggled per company on its detail page. Disabling a module here removes it from the catalog for future toggling — tenants that already have it enabled keep working.</p></div>
    <div class="card" style="padding:0;overflow:hidden">
      <table><thead><tr><th>Module</th><th>Group</th><th>Status</th><th></th></tr></thead><tbody>${rows}</tbody></table>
    </div>`;
}
async function disableModule(key) {
  if (!confirm(`Disable "${key}" in the catalog? Existing tenant toggles are unaffected.`)) return;
  const res = await api(`/api/platform/modules/${key}`, { method: 'DELETE' });
  if (res && res.ok) { flash('Module disabled.'); screenModuleCatalog(); }
  else flash(_lastApiError || 'Could not disable module.', false);
}

// ── Subscriptions & plans (Feature E) ───────────────────────────────────────
async function screenSubscriptions() {
  setTitle('Subscriptions');
  const subs = await api('/api/platform/subscriptions');
  if (!subs) { showErr('Could not load subscriptions.'); return; }
  const rows = subs.map(t => {
    const dr = t.days_remaining;
    let drBadge = '<span class="pill">—</span>';
    if (dr != null) drBadge = `<span class="pill ${dr < 0 ? 'suspended' : dr <= 14 ? 'trial' : 'active'}">${dr < 0 ? 'Expired' : dr + ' days left'}</span>`;
    return `<tr class="clickable-row" onclick="navigate('companies','${t.id}')">
      <td><strong>${esc(t.name)}</strong></td>
      <td>${esc(t.subscription_plan||'—')}</td>
      <td>${t.subscription_end_date ? new Date(t.subscription_end_date).toLocaleDateString() : '—'}</td>
      <td>${drBadge}</td>
      <td>${esc(t.admin_contact||'—')}</td>
      <td onclick="event.stopPropagation()"><button class="btn btn-ghost btn-sm" onclick="sendRenewalReminder('${t.id}')">Send reminder</button></td>
    </tr>`;
  }).join('');
  document.getElementById('content').innerHTML = `
    <div class="page-header"><h1>Subscriptions</h1><button class="btn btn-ghost" onclick="screenSubscriptionPlans()">Manage plans</button></div>
    <div class="card" style="padding:0;overflow:hidden">
      ${rows ? `<table><thead><tr><th>Company</th><th>Plan</th><th>Renews</th><th>Remaining</th><th>Admin</th><th></th></tr></thead><tbody>${rows}</tbody></table>` : '<p class="empty">No companies yet.</p>'}
    </div>`;
}

async function sendRenewalReminder(tenantId) {
  const res = await api(`/api/platform/tenants/${tenantId}/send-renewal-reminder`, { method: 'POST' });
  if (res && res.ok) flash(`Reminder sent to ${res.sent_to}.`);
  else flash(res?.detail || _lastApiError || 'Could not send reminder.', false);
}

async function screenSubscriptionPlans() {
  setTitle('Subscription Plans');
  const plans = await api('/api/platform/subscription-plans');
  if (!plans) { showErr('Could not load plans.'); return; }
  const rows = plans.map(p => `
    <tr><td><strong>${esc(p.plan_name)}</strong></td>
        <td>${(p.allowed_modules_json||[]).length ? esc(p.allowed_modules_json.join(', ')) : 'All modules'}</td>
        <td>${p.price_monthly != null ? '$'+p.price_monthly : '—'}</td>
        <td>${p.price_yearly != null ? '$'+p.price_yearly : '—'}</td></tr>`).join('');
  document.getElementById('content').innerHTML = `
    <div class="page-header"><h1>Subscription Plans</h1><button class="btn btn-ghost" onclick="navigate('subscriptions')">← Back</button></div>
    <div class="card" style="padding:0;overflow:hidden">
      <table><thead><tr><th>Plan</th><th>Allowed modules</th><th>Monthly</th><th>Yearly</th></tr></thead><tbody>${rows}</tbody></table>
    </div>`;
}

let _subTenantId = null;
function openSubscriptionModal(tenantId, plan, endDate) {
  _subTenantId = tenantId;
  document.getElementById('sub-plan').value = plan || 'standard';
  document.getElementById('sub-end-date').value = endDate || '';
  document.getElementById('subscription-modal').classList.add('open');
}
function closeSubscriptionModal() { document.getElementById('subscription-modal').classList.remove('open'); }
async function doSetSubscription() {
  const body = {
    plan: document.getElementById('sub-plan').value.trim(),
    subscription_end_date: document.getElementById('sub-end-date').value || null,
  };
  const res = await api(`/api/platform/tenants/${_subTenantId}/subscription`, { method: 'PUT', body });
  if (res && res.id) { flash('Subscription updated.'); closeSubscriptionModal(); navigate('companies', _subTenantId); }
  else flash(res?.detail || _lastApiError || 'Could not update subscription.', false);
}

// ── All Users + Impersonation (Feature F) ───────────────────────────────────
let _usersSearch = '';
async function screenAllUsers() {
  setTitle('All Users');
  const q = _usersSearch ? `?search=${encodeURIComponent(_usersSearch)}` : '';
  const users = await api(`/api/platform/users${q}`);
  if (!users) { showErr('Could not load users.'); return; }
  const rows = users.map(u => `
    <tr>
      <td><strong>${esc(u.full_name)}</strong><br><span style="font-size:11px;color:var(--muted)">${esc(u.email)}</span></td>
      <td>${esc(u.tenant_name||'—')}</td>
      <td>${esc(u.role)}</td>
      <td><span class="pill ${u.is_active?'active':'inactive'}">${u.is_active?'Active':'Inactive'}</span></td>
      <td>${u.last_login_at ? new Date(u.last_login_at).toLocaleDateString() : '—'}</td>
      <td><div class="inline-btns">
        ${u.is_active ? `<button class="btn btn-ghost btn-sm" onclick="impersonateUser('${u.id}','${escAttr(u.full_name)}')">Impersonate</button>` : ''}
        ${u.is_active
          ? `<button class="btn btn-danger btn-sm" onclick="setUserStatus('${u.id}',false)">Deactivate</button>`
          : `<button class="btn btn-ghost btn-sm" onclick="setUserStatus('${u.id}',true)">Activate</button>`}
      </div></td>
    </tr>`).join('');
  document.getElementById('content').innerHTML = `
    <div class="page-header"><h1>All Users</h1>
      <input id="users-search" placeholder="Search name or email…" value="${escAttr(_usersSearch)}" style="padding:8px 11px;border:1px solid var(--border);border-radius:4px;font-family:inherit;font-size:13px;min-width:220px">
    </div>
    <div class="card" style="padding:0;overflow:hidden">
      ${rows ? `<table><thead><tr><th>Name</th><th>Company</th><th>Role</th><th>Status</th><th>Last login</th><th>Actions</th></tr></thead><tbody>${rows}</tbody></table>` : '<p class="empty">No users found.</p>'}
    </div>`;
  const searchInput = document.getElementById('users-search');
  searchInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') { _usersSearch = searchInput.value.trim(); screenAllUsers(); }
  });
}

async function setUserStatus(userId, isActive) {
  if (!isActive && !confirm('Deactivate this user? Their session ends immediately and they can no longer log in.')) return;
  const res = await api(`/api/platform/users/${userId}/status`, { method: 'PATCH', body: { is_active: isActive } });
  if (res && res.id) { flash('User updated.'); screenAllUsers(); }
  else flash(res?.detail || _lastApiError || 'Could not update user.', false);
}

// Opens index.html in a new tab as the impersonated user, WITHOUT touching
// this tab's own platform session or index.html's normal localStorage
// session -- the token rides a one-time query param that index.html's boot
// consumes into its own tab-scoped sessionStorage (see index.html).
async function impersonateUser(userId, name) {
  if (!confirm(`Impersonate ${name}? This opens a new tab as them for 15 minutes. The action is logged.`)) return;
  const res = await api(`/api/platform/impersonate/${userId}`, { method: 'POST' });
  if (res && res.token) {
    window.open('/?impersonate=' + encodeURIComponent(res.token), '_blank');
  } else flash(res?.detail || _lastApiError || 'Could not impersonate user.', false);
}

// ── Issues & Tickets (Feature G) ────────────────────────────────────────────
async function screenIssuesTickets(param) {
  if (param) return screenTicketThread(param);
  setTitle('Issues & Tickets');
  const tickets = await api('/api/platform/tickets');
  if (!tickets) { showErr('Could not load tickets.'); return; }
  const rows = tickets.map(t => `
    <tr class="clickable-row" onclick="navigate('tickets','${t.id}')">
      <td>${esc(t.subject)}<br><span style="font-size:11px;color:var(--muted)">${esc(t.category)}</span></td>
      <td>${esc(t.tenant_name||'—')}</td>
      <td>${esc(t.raised_by_name)}</td>
      <td><span class="pill ${t.status}">${esc(t.status)}</span></td>
      <td>${new Date(t.created_at).toLocaleDateString()}</td>
    </tr>`).join('');
  document.getElementById('content').innerHTML = `
    <div class="page-header"><h1>Issues & Tickets</h1></div>
    <div class="card" style="padding:0;overflow:hidden">
      ${rows ? `<table><thead><tr><th>Subject</th><th>Company</th><th>Raised by</th><th>Status</th><th>Created</th></tr></thead><tbody>${rows}</tbody></table>` : '<p class="empty">No tickets.</p>'}
    </div>`;
}

async function screenTicketThread(ticketId) {
  setTitle('Ticket');
  const [tickets, replies] = await Promise.all([
    api('/api/platform/tickets'),
    api(`/api/platform/tickets/${ticketId}/replies`),
  ]);
  const t = (tickets||[]).find(x => x.id === ticketId);
  if (!t) { showErr('Ticket not found.'); return; }
  const replyRows = (replies||[]).map(r => `
    <div style="padding:10px 0;border-bottom:1px solid var(--border)">
      <div style="font-size:12px;color:var(--muted)">${esc(r.author_name)} · ${new Date(r.created_at).toLocaleString()}</div>
      <div style="margin-top:4px">${esc(r.body)}</div>
    </div>`).join('');
  document.getElementById('content').innerHTML = `
    <div class="page-header"><h1>${esc(t.subject)}</h1><button class="btn btn-ghost" onclick="navigate('tickets')">← Back</button></div>
    <div class="card">
      <p style="margin-bottom:10px">${esc(t.description||'')}</p>
      <div style="display:flex;gap:10px;align-items:center;margin-bottom:14px">
        <span class="pill ${t.status}">${esc(t.status)}</span>
        <select id="ticket-status-select" style="padding:6px 9px;border:1px solid var(--border);border-radius:4px">
          <option value="open" ${t.status==='open'?'selected':''}>Open</option>
          <option value="in_progress" ${t.status==='in_progress'?'selected':''}>In progress</option>
          <option value="resolved" ${t.status==='resolved'?'selected':''}>Resolved</option>
        </select>
        <button class="btn btn-primary btn-sm" onclick="updateTicketStatus('${t.id}')">Update status</button>
      </div>
      <div class="card-title">Replies</div>
      ${replyRows || '<p class="empty">No replies yet.</p>'}
      <div class="form-group" style="margin-top:14px"><label>Add a reply</label><textarea id="ticket-reply-body"></textarea></div>
      <button class="btn btn-primary" onclick="postTicketReply('${t.id}')">Send reply</button>
    </div>`;
}

async function updateTicketStatus(ticketId) {
  const status = document.getElementById('ticket-status-select').value;
  const res = await api(`/api/platform/tickets/${ticketId}`, { method: 'PATCH', body: { status } });
  if (res && res.id) { flash('Status updated.'); navigate('tickets', ticketId); }
  else flash(res?.detail || _lastApiError || 'Could not update.', false);
}
async function postTicketReply(ticketId) {
  const body = document.getElementById('ticket-reply-body').value.trim();
  if (!body) return;
  const res = await api(`/api/platform/tickets/${ticketId}/replies`, { method: 'POST', body: { body } });
  if (res && res.id) { flash('Reply posted.'); navigate('tickets', ticketId); }
  else flash(res?.detail || _lastApiError || 'Could not post reply.', false);
}

// ── System Health (Feature H) ───────────────────────────────────────────────
async function screenSystemHealth() {
  setTitle('System Health');
  const d = await api('/api/platform/system-health');
  if (!d) { showErr('Could not load system health.'); return; }
  const uCounts = d.user_counts||[], tStats = d.ticket_stats||[], pipe = d.pipeline||{}, lt = d.login_trend||{today:0,yesterday:0};
  const totalUsers = uCounts.reduce((s,x)=>s+parseInt(x.n||0),0);
  const heartbeatRows = (d.system_status||[]).map(s => `
    <tr><td>${esc(s.key)}</td><td>${esc(s.value)}</td><td>${new Date(s.updated_at).toLocaleString()}</td></tr>`).join('');
  document.getElementById('content').innerHTML = `
    <div class="page-header"><h1>System Health</h1></div>
    <div class="stage-grid">
      <div class="stage-card"><div class="n">${totalUsers}</div><div class="lbl">Active users</div></div>
      <div class="stage-card"><div class="n">${pipe.open_reqs||0}</div><div class="lbl">Open reqs</div></div>
      <div class="stage-card"><div class="n">${pipe.total_apps||0}</div><div class="lbl">Applications</div></div>
      <div class="stage-card"><div class="n">${pipe.total_candidates||0}</div><div class="lbl">Candidates</div></div>
      <div class="stage-card"><div class="n">${lt.today}</div><div class="lbl">Logins today</div></div>
    </div>
    <div class="two-col" style="margin-bottom:20px">
      <div class="card"><div class="card-title">Users by Role</div><div class="chart-wrap" style="height:180px"><canvas id="ph-users-bar"></canvas></div></div>
      <div class="card"><div class="card-title">Ticket Status</div><div class="chart-wrap" style="height:180px"><canvas id="ph-tickets-pie"></canvas></div></div>
    </div>
    <div class="page-header" style="margin-top:8px"><h1 style="font-size:16px">Background Workers (system_status)</h1></div>
    <div class="card" style="padding:0;overflow:hidden">
      ${heartbeatRows ? `<table><thead><tr><th>Key</th><th>Value</th><th>Updated</th></tr></thead><tbody>${heartbeatRows}</tbody></table>` : '<p class="empty">No heartbeat keys recorded.</p>'}
    </div>`;
  if (window.Chart) {
    if (uCounts.length) new Chart(document.getElementById('ph-users-bar'), {
      type: 'bar',
      data: { labels: uCounts.map(x=>x.role), datasets: [{ data: uCounts.map(x=>x.n), backgroundColor: '#2563EB' }] },
      options: { plugins: { legend: { display: false } } },
    });
    if (tStats.length) new Chart(document.getElementById('ph-tickets-pie'), {
      type: 'doughnut',
      data: { labels: tStats.map(x=>x.status), datasets: [{ data: tStats.map(x=>x.n), backgroundColor: ['#0e9f6e','#b07d00','#596A83'] }] },
    });
  }
}

function openGrantSuperadminModal() {
  document.getElementById('gs-name').value = '';
  document.getElementById('gs-email').value = '';
  document.getElementById('grant-superadmin-modal').classList.add('open');
}
function closeGrantSuperadminModal() { document.getElementById('grant-superadmin-modal').classList.remove('open'); }
async function doGrantSuperadmin() {
  const body = {
    full_name: document.getElementById('gs-name').value.trim(),
    email: document.getElementById('gs-email').value.trim(),
  };
  if (!body.full_name || !body.email) { flash('Fill in all fields.', false); return; }
  const res = await api('/api/platform/settings/superadmins', { method: 'POST', body });
  if (res && res.id) { flash('Superadmin added.'); closeGrantSuperadminModal(); navigate('settings'); }
  else flash(res?.detail || _lastApiError || 'Could not add superadmin.', false);
}
async function revokeSuperadmin(id, name) {
  if (!confirm(`Revoke platform-admin access for ${name}? Their session ends immediately.`)) return;
  const res = await api(`/api/platform/settings/superadmins/${id}`, { method: 'DELETE' });
  if (res && res.ok) { flash('Access revoked.'); navigate('settings'); }
  else flash(res?.detail || _lastApiError || 'Could not revoke access.', false);
}
async function savePlatformDefaults() {
  const body = { default_plan: document.getElementById('pd-plan').value.trim() };
  const res = await api('/api/platform/settings/defaults', { method: 'PUT', body });
  if (res) flash('Defaults saved.');
  else flash(_lastApiError || 'Could not save defaults.', false);
}

const SCREENS = {
  dashboard:     screenDashboard,
  companies:     screenCompanies,
  subscriptions: screenSubscriptions,
  all_users:     screenAllUsers,
  tickets:       screenIssuesTickets,
  audit:         screenAuditLogs,
  analytics:     screenUsageAnalytics,
  modules:       screenModuleCatalog,
  sys_health:    screenSystemHealth,
  settings:      screenPlatformSettings,
};

function buildNav() {
  const nav = document.getElementById('sidenav');
  nav.innerHTML = NAV_ITEMS.map(it =>
    `<div class="nav-item" id="nav-${it.id}" onclick="navigate('${it.id}')">
       <span class="nav-icon">${it.icon}</span>${it.label}
     </div>`
  ).join('') +
  `<div class="nav-spacer"></div>
   <div class="nav-sep"></div>
   <div class="nav-item danger" onclick="logout()"><span class="nav-icon">🚪</span>Sign out</div>
   <div class="sidebar-powered"><span class="pw-label">Powered by</span><span class="pw-wordmark">ENTERNSTECH</span></div>`;

  document.getElementById('topbar-name').textContent = ME.name;
  const initials = (ME.name||'?').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
  document.getElementById('topbar-avatar').textContent = initials;
}

function setActive(id) {
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  const el = document.getElementById(`nav-${id}`);
  if (el) el.classList.add('active');
}
function setTitle(t) { document.getElementById('topbar-title').textContent = t; }

function navigate(id, param) {
  history.pushState({}, '', param ? `#${id}/${param}` : `#${id}`);
  runRoute(id, param);
}

let _currentScreen = null;
function runRoute(id, param) {
  _currentScreen = id;
  setActive(id);
  document.getElementById('content').innerHTML = '<p class="empty">Loading…</p>';
  const fn = SCREENS[id] || SCREENS.dashboard;
  try {
    const ret = fn(param);
    if (ret && typeof ret.catch === 'function') ret.catch(e => { showErr(e.message); console.error('route:', e); });
  } catch (e) {
    showErr(e.message);
    console.error('route:', e);
  }
}

// ── Mobile navigation drawer (identical to index.html's) ────────────────────
(function initMobileNav(){
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('sidebar-overlay');
  const btn     = document.getElementById('menu-btn');
  if (!btn || !sidebar || !overlay) return;

  function openNav() {
    sidebar.classList.add('mob-open');
    overlay.classList.add('mob-open');
    btn.setAttribute('aria-expanded','true');
    btn.innerHTML = '&#10005;';
    document.body.style.overflow = 'hidden';
  }
  function closeNav() {
    sidebar.classList.remove('mob-open');
    overlay.classList.remove('mob-open');
    btn.setAttribute('aria-expanded','false');
    btn.innerHTML = '&#9776;';
    document.body.style.overflow = '';
  }
  btn.addEventListener('click', () => sidebar.classList.contains('mob-open') ? closeNav() : openNav());
  overlay.addEventListener('click', closeNav);
  sidebar.addEventListener('click', function(e) {
    if (e.target.closest('.nav-item') && window.innerWidth <= 768) closeNav();
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeNav(); });
})();

(function boot(){
  buildNav();
  const hp = (location.hash||'').split(/[#\/]/);
  const initId = hp[1] || 'dashboard';
  const initParam = hp[2];
  runRoute(initId, initParam);
})();
</script>
