<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0A1F44">
<title>Enternly — Set Password</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0A1F44; --paper: #F8FCFE; --card: #ffffff; --navy: #0A1F44;
    --line: #D7E0EC; --accent: #2563EB; --muted: #596A83;
    --font-head: 'Space Grotesk', system-ui, sans-serif;
    --font-body: 'IBM Plex Sans', system-ui, sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }
  html, body { height: 100%; overflow: hidden; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  body {
    font-family: var(--font-body);
    background: var(--paper); color: var(--ink);
    height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 16px;
  }
  .box {
    background: var(--card); width: 100%; max-width: 480px;
    border: 1px solid var(--line); border-radius: 8px; overflow: hidden;
    box-shadow: 0 4px 24px rgba(37,99,235,0.10);
  }
  .box-top {
    padding: 24px 44px 18px; text-align: center;
    border-bottom: 4px solid var(--accent);
  }
  .logo { height: 110px; width: auto; margin-bottom: 10px; }
  .tagline { font-family: var(--font-head); font-size: 11px; color: var(--accent); letter-spacing: 2px; text-transform: uppercase; font-weight: 600; }
  .box-body { padding: 24px 44px 20px; }
  h1 { font-family: var(--font-head); font-size: 22px; font-weight: 700; margin-bottom: 14px; color: var(--navy); }
  .msg-box {
    font-size: 14px; padding: 10px 14px; border-radius: 4px; margin-bottom: 14px;
  }
  .msg-box.error { background: #fdeaee; border: 1px solid #f6c9d1; color: #e2455a; }
  .msg-box.success { background: #e8f7f0; border: 1px solid #b7e6d4; color: #0e9f6e; }
  label {
    display: block; font-size: 12px; text-transform: uppercase;
    letter-spacing: 1px; color: var(--muted); margin: 14px 0 5px; font-weight: 600;
  }
  input {
    width: 100%; padding: 11px 14px; border: 1px solid var(--line);
    border-radius: 6px; font-family: inherit; font-size: 16px;
    background: #f7f8fc; outline: none; transition: border-color 0.15s;
  }
  input:focus { border-color: var(--accent); background: #fff; }
  .pw-wrap { position: relative; }
  .pw-wrap input { padding-right: 42px; }
  .pw-toggle {
    position: absolute; top: 50%; right: 6px; transform: translateY(-50%);
    background: none; border: none; cursor: pointer; padding: 6px;
    line-height: 0; font-size: 18px; color: var(--muted);
  }
  .pw-toggle:hover { color: var(--ink); }
  .btn {
    width: 100%; margin-top: 20px; padding: 14px; background: var(--accent);
    color: #fff; border: none; border-radius: 6px; font-family: inherit;
    font-size: 17px; cursor: pointer; font-weight: 600; letter-spacing: 0.3px; transition: background 0.15s;
  }
  .btn:hover { background: var(--navy); }
  .btn:disabled { opacity: 0.6; cursor: not-allowed; }
  .back-link {
    display: block; text-align: center; margin-top: 16px;
    font-size: 13px; color: var(--muted); text-decoration: none; font-weight: 600;
  }
  .back-link:hover { color: var(--accent); }
  .powered-footer {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding: 14px; border-top: 1px solid var(--line); background: #f7f8fc;
  }
  .powered-footer span { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 1.2px; font-weight: 600; }
  .powered-footer img { height: 30px; width: auto; }
  @media (max-width: 540px) {
    body { padding: 0; justify-content: flex-start; overflow-y: auto; }
    .box { max-width: 100%; border-radius: 0; border-left: none; border-right: none; box-shadow: none; }
    .box-top { padding: 20px 24px 16px; }
    .box-body { padding: 20px 24px 20px; }
    .logo { height: 80px; }
    h1 { font-size: 20px; }
  }
  @media screen and (-webkit-min-device-pixel-ratio: 0) { input { font-size: 16px; } }
  button { touch-action: manipulation; -webkit-appearance: none; appearance: none; }
</style>
</head>
<body>
<div class="box">
  <div class="box-top">
    <img src="/assets/Enternly_logo.png" alt="Enternly" class="logo">
  </div>
  <div class="box-body">
    <h1 id="page-title">Set your password</h1>
    <div id="msg" class="msg-box" style="display:none"></div>
    <div id="form-wrap">
      <label for="pw">New password</label>
      <div class="pw-wrap">
        <input id="pw" type="password" autocomplete="new-password" placeholder="At least 8 characters">
        <button type="button" class="pw-toggle" tabindex="-1" aria-label="Show password" onclick="togglePw('pw', this)">👁</button>
      </div>
      <label for="pw2">Confirm password</label>
      <div class="pw-wrap">
        <input id="pw2" type="password" autocomplete="new-password" placeholder="Re-enter password">
        <button type="button" class="pw-toggle" tabindex="-1" aria-label="Show password" onclick="togglePw('pw2', this)">👁</button>
      </div>
      <button class="btn" id="btn" onclick="doSetPassword()">Set password</button>
    </div>
    <a href="/login" class="back-link">← Back to login</a>
  </div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const token  = params.get('token') || '';
let accountType = 'staff';

if (!token) {
  showMsg('error', 'Invalid or missing link. Request a new one.');
  document.getElementById('form-wrap').style.display = 'none';
} else {
  // Validate token on load
  fetch('/api/auth/reset-token/validate?token=' + encodeURIComponent(token))
    .then(r => r.json())
    .then(data => {
      if (!data.valid) {
        showMsg('error', 'This link has expired or already been used. Request a new password reset.');
        document.getElementById('form-wrap').style.display = 'none';
      } else {
        accountType = data.account_type || 'staff';
      }
    })
    .catch(() => {});
}

function signInPathFor(type) {
  if (type === 'candidate') return '/candidate-portal';
  if (type === 'vendor') return '/vendor-portal';
  return '/login';
}

function togglePw(id, btn) {
  const input = document.getElementById(id);
  const show = input.type === 'password';
  input.type = show ? 'text' : 'password';
  btn.textContent = show ? '🙈' : '👁';
  btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
}

function showMsg(type, text) {
  const el = document.getElementById('msg');
  el.className = 'msg-box ' + type;
  el.textContent = text;
  el.style.display = 'block';
}

document.getElementById('pw2').addEventListener('keydown', e => {
  if (e.key === 'Enter') doSetPassword();
});

async function doSetPassword() {
  const pw  = document.getElementById('pw').value;
  const pw2 = document.getElementById('pw2').value;
  const btn = document.getElementById('btn');

  if (pw.length < 8) { showMsg('error', 'Password must be at least 8 characters.'); return; }
  if (pw !== pw2)    { showMsg('error', 'Passwords do not match.'); return; }

  btn.disabled = true; btn.textContent = 'Setting password…';
  try {
    const res  = await fetch('/api/auth/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, new_password: pw }),
    });
    const data = await res.json();
    if (!res.ok) {
      showMsg('error', data.detail || 'Could not set password. The link may have expired.');
      return;
    }
    showMsg('success', 'Password set! Redirecting to sign in…');
    document.getElementById('form-wrap').style.display = 'none';
    setTimeout(() => window.location.replace(signInPathFor(accountType)), 1800);
  } catch {
    showMsg('error', 'Could not reach the server. Is the backend running?');
  } finally {
    btn.disabled = false; btn.textContent = 'Set password';
  }
}
</script>
</body>
</html>
